[package]
name = "boolean-toggle"
description = "Zed WASM adapter for the boolean-toggle LSP server"
version = "0.3.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "boolean-toggle-lsp"
path = "src/main.rs"

[dependencies]
zed_extension_api = "0.7"
serde_json = "1"

[profile.release]
opt-level = 3 # Speed, not size
lto = "fat" # Full LTO
codegen-units = 1 # Single unit for maximum inlining
panic = "abort" # No unwinding cost
strip = false # Keep symbols for profiling
