[package]
name = "boolean-toggle"
description = "Zed WASM adapter for the boolean-toggle LSP server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# cdylib is required for Zed WASM extensions.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Check https://crates.io/crates/zed_extension_api for the latest version.
zed_extension_api = "0.7"
