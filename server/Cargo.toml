[package]
name = "boolean-toggle-lsp"
description = "Minimal LSP server that toggles boolean values"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "boolean-toggle-lsp"
path = "src/main.rs"

[dependencies]
# serde_json is the only runtime dependency. No heavy LSP framework needed
serde_json = "1"

[profile.release]
strip = true # Remove debug symbols → smaller binary
opt-level = "z" # Optimise for size
lto = true # Link-time optimisation
