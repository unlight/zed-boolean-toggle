[package]
name = "boolean-toggle-lsp"
version = "0.3.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "boolean-toggle-lsp"
path = "src/main.rs"

[dependencies]
# serde_json is the only runtime dependency. No heavy LSP framework needed
serde_json = "1"

[profile.release]
opt-level = 3          # Speed, not size
lto = "fat"            # Full LTO
codegen-units = 1      # Single unit for maximum inlining
panic = "abort"        # No unwinding cost
strip = false          # Keep symbols for profiling
