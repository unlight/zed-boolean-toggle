name: Release LSP Binaries

on:
  release:
    types: [created]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: boolean-toggle-lsp-x86_64-unknown-linux-gnu
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: boolean-toggle-lsp-x86_64-apple-darwin
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: boolean-toggle-lsp-aarch64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: boolean-toggle-lsp-x86_64-pc-windows-msvc.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        # Notice we explicitly point to the server's Cargo.toml
        run: cargo build --release --target ${{ matrix.target }} --manifest-path server/Cargo.toml

      - name: Prepare Asset
        shell: bash
        run: |
          # Define the path to the compiled binary
          BIN_PATH="server/target/${{ matrix.target }}/release/boolean-toggle-lsp"

          # Add .exe extension for Windows
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN_PATH="${BIN_PATH}.exe"
          fi

          # Copy and rename to the exact asset name expected by the extension
          cp "$BIN_PATH" "${{ matrix.asset_name }}"

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream
