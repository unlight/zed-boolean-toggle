id = "toggle-bool"
name = "Toggle Bool"
description = "Toggle boolean-like tokens under the cursor: true/false, TRUE/FALSE, True/False — plus 1/0, on/off, yes/no in Markdown."
version = "0.1.0"
schema_version = 1
authors = ["Your Name <you@example.com>"]
repository = "https://github.com/your-name/zed-toggle-bool"

# Slash commands are the supported way for an extension to expose a
# callable action today. See README for how to bind it to ctrl-alt-x.
[slash_commands.toggle-bool]
description = "Toggle the boolean-like token passed as argument (true/false, on/off, yes/no, 1/0)."
requires_argument = false
