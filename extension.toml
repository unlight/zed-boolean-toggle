id = "boolean-toggle"
name = "Boolean Toggle"
description = "Toggle true/false, yes/no, on/off, 1/0 in any language, with case preservation."
version = "0.3.0"
schema_version = 1
authors = ["Roman"]
repository = "https://github.com/unlight/zed-boolean-toggle"

# Zed starts the LSP when any file of a listed language is opened.
# To add a language not listed here, append its Zed language name
# (Settings → Open Default Settings → "languages" for the canonical names).
[language_servers.boolean-toggle-lsp]
name = "boolean-toggle-lsp"
languages = [
  # Web
  "JavaScript",
  "TypeScript",
  "JSX",
  "TSX",
  "HTML",
  "CSS",
  "SCSS",
  "Vue",
  "Svelte",
  "Astro",
  # Systems
  "Rust",
  "C",
  "C++",
  "Go",
  "Swift",
  "Zig",
  # JVM / CLR
  "Java",
  "Kotlin",
  "Scala",
  "C#",
  "Dart",
  # Scripting
  "Python",
  "Ruby",
  "PHP",
  "Lua",
  "Elixir",
  "Erlang",
  "Haskell",
  "OCaml",
  "F#",
  "Clojure",
  "Julia",
  "R",
  # Shell
  "Bash",
  "Fish",
  # Config / Data
  "JSON",
  "YAML",
  "TOML",
  "XML",
  # Docs / Text
  "Markdown",
  "Plain Text",
  # Other
  "SQL",
  "Dockerfile",
  "Nix",
  "Terraform",
  "GDScript",
  "GLSL",
]
